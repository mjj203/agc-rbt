
worker_rlimit_nofile 65536;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx/nginx.pid;

events {
  worker_connections 8192;
  multi_accept on;
  use epoll;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  
  log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                  '$status $body_bytes_sent "$http_referer" '
                  '"$http_user_agent" "$http_x_forwarded_for"';
  
  access_log /var/log/nginx/access.log main;
  
  sendfile on;
  tcp_nopush on;
  tcp_nodelay on;
  keepalive_timeout 60;
  types_hash_max_size 4096;
  server_tokens off;
  
  upstream uwsgi_servers {
    server mapproxy:5000;
    keepalive 128;
  }

  proxy_cache_path /var/cache/nginx/tile_cache
                  levels=1:2
                  max_size=10g
                  inactive=60m
                  use_temp_path=off
                  keys_zone=backend_cache:10m;

  # Separate cache zone for the uwsgi_* directives used by the MapProxy
  # locations below. nginx tags shared memory zones by the module that
  # declared them (proxy_module vs uwsgi_module); reusing "backend_cache"
  # here would fail to start with "the shared memory zone ... is already
  # declared for a different use".
  uwsgi_cache_path /var/cache/nginx/mapproxy_cache
                  levels=1:2
                  max_size=10g
                  inactive=60m
                  use_temp_path=off
                  keys_zone=mapproxy_cache:10m;

  gzip on;
  gzip_vary on;
  gzip_proxied any; # Compress for all proxied requests
  gzip_comp_level 6; # Balance between CPU and compression ratio (1-9)
  gzip_buffers 16 8k;
  gzip_http_version 1.1;
  gzip_min_length 256; # Don't compress very small files
  gzip_types
    application/atom+xml
    application/geo+json
    application/javascript
    application/x-javascript
    application/json
    application/ld+json
    application/manifest+json
    application/rdf+xml
    application/rss+xml
    application/vnd.ms-fontobject
    application/wasm
    application/x-web-app-manifest+json
    application/xhtml+xml
    application/xml
    font/eot
    font/otf
    font/ttf
    image/bmp
    image/png
    image/svg+xml
    image/x-icon
    text/cache-manifest
    text/calendar
    text/css
    text/javascript
    text/plain
    text/markdown
    text/vcard
    text/vnd.rim.location.xloc
    text/vtt
    text/x-component
    text/xml;

  server {
    listen 8081;
    server_name _;
    
    # MapProxy endpoints with /mapproxy prefix
    location /mapproxy/ {
      include /etc/nginx/uwsgi_params;
      uwsgi_pass uwsgi_servers;
      
      # Strip the /mapproxy prefix when passing to MapProxy.
      # uwsgi_params (included above) already sets PATH_INFO from
      # $document_uri, which reflects the rewrite below -- setting it
      # again from $1 here would pass a path with no leading slash.
      uwsgi_param SCRIPT_NAME /mapproxy;
      
      # Rewrite the path to remove /mapproxy prefix
      rewrite ^/mapproxy/(.*) /$1 break;

      # Enable caching
      uwsgi_cache mapproxy_cache;
      uwsgi_cache_valid 200 302 404 1h;
      uwsgi_cache_key $scheme$request_method$host$request_uri;
      uwsgi_cache_lock on;
      # Note: the uwsgi module's cache_use_stale tokens differ from the
      # proxy module's -- it has no http_502/http_504 (there's no HTTP
      # "gateway" concept over the raw uwsgi protocol).
      uwsgi_cache_use_stale updating error timeout invalid_header http_500 http_503;
      uwsgi_cache_revalidate on;
      uwsgi_cache_background_update on;
      add_header X-Cache-Status $upstream_cache_status;

      uwsgi_param UWSGI_SCHEME $scheme;
      uwsgi_param SERVER_SOFTWARE nginx/$nginx_version;
      
      uwsgi_socket_keepalive on;
      uwsgi_buffering on;
      uwsgi_buffer_size 32k;
      uwsgi_buffers 16 32k;
      uwsgi_busy_buffers_size 64k;
      uwsgi_read_timeout 80s;
      uwsgi_send_timeout 65s;
      uwsgi_connect_timeout 5s;
    }
    
    # TileserverGL endpoints with /tileservergl prefix
    location /tileservergl/ {
      # Strip the /tileservergl prefix when proxying
      rewrite ^/tileservergl/(.*) /$1 break;
      
      # Proxy to TileserverGL container
      proxy_pass http://tileservergl:8080;
      
      # Enable caching for tile requests
      proxy_cache backend_cache;
      proxy_cache_valid 200 302 404 1h;
      proxy_cache_key $scheme$request_method$host$request_uri;
      proxy_cache_lock on;
      proxy_cache_use_stale updating error timeout invalid_header http_500 http_502 http_503 http_504;
      proxy_cache_revalidate on;
      proxy_cache_background_update on;
      add_header X-Cache-Status $upstream_cache_status;
      
      # Proxy headers
      proxy_set_header Host $http_host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Forwarded-Host $http_host;
      
      # Proxy settings
      proxy_buffering on;
      proxy_buffer_size 32k;
      proxy_buffers 16 32k;
      proxy_busy_buffers_size 64k;
      proxy_read_timeout 80s;
      proxy_send_timeout 65s;
      proxy_connect_timeout 5s;
    }
    
    # Default location (backwards compatibility - direct to MapProxy)
    location / {
      include /etc/nginx/uwsgi_params;
      uwsgi_pass uwsgi_servers;

      # Enable caching
      uwsgi_cache mapproxy_cache;
      uwsgi_cache_valid 200 302 404 1h;
      uwsgi_cache_key $scheme$request_method$host$request_uri;
      uwsgi_cache_lock on;
      uwsgi_cache_use_stale updating error timeout invalid_header http_500 http_503;
      uwsgi_cache_revalidate on;
      uwsgi_cache_background_update on;
      add_header X-Cache-Status $upstream_cache_status;

      uwsgi_param UWSGI_SCHEME $scheme;
      uwsgi_param SERVER_SOFTWARE nginx/$nginx_version;
      
      uwsgi_socket_keepalive on;
      uwsgi_buffering on;
      uwsgi_buffer_size 32k;
      uwsgi_buffers 16 32k;
      uwsgi_busy_buffers_size 64k;
      uwsgi_read_timeout 80s;
      uwsgi_send_timeout 65s;
      uwsgi_connect_timeout 5s;
    }

    # Health check endpoint for docker-compose / orchestrator probes
    location = /healthz {
      access_log off;
      add_header Content-Type text/plain;
      return 200 "ok\n";
    }
  }
} 