
worker_rlimit_nofile 65536;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx/nginx.pid;

events {
  worker_connections 8192;
  multi_accept on;
  use epoll;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  
  log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                  '$status $body_bytes_sent "$http_referer" '
                  '"$http_user_agent" "$http_x_forwarded_for"';
  
  access_log /var/log/nginx/access.log main;
  
  sendfile on;
  tcp_nopush on;
  tcp_nodelay on;
  keepalive_timeout 60;
  types_hash_max_size 4096;
  server_tokens off;
  
  upstream mapproxy_servers {
    server mapproxy:5000;
    keepalive 128;
  }

  # mapproxy and tileservergl both speak plain HTTP (mapproxy via uwsgi's
  # built-in http-socket router -- see mapproxy/config/uwsgi.ini), so a
  # single proxy_cache zone covers both backends below.
  proxy_cache_path /var/cache/nginx/tile_cache
                  levels=1:2
                  max_size=10g
                  inactive=60m
                  use_temp_path=off
                  keys_zone=backend_cache:10m;

  gzip on;
  gzip_vary on;
  gzip_proxied any; # Compress for all proxied requests
  gzip_comp_level 6; # Balance between CPU and compression ratio (1-9)
  gzip_buffers 16 8k;
  gzip_http_version 1.1;
  gzip_min_length 256; # Don't compress very small files
  gzip_types
    application/atom+xml
    application/geo+json
    application/javascript
    application/x-javascript
    application/json
    application/ld+json
    application/manifest+json
    application/rdf+xml
    application/rss+xml
    application/vnd.ms-fontobject
    application/wasm
    application/x-web-app-manifest+json
    application/xhtml+xml
    application/xml
    font/eot
    font/otf
    font/ttf
    image/bmp
    image/png
    image/svg+xml
    image/x-icon
    text/cache-manifest
    text/calendar
    text/css
    text/javascript
    text/plain
    text/markdown
    text/vcard
    text/vnd.rim.location.xloc
    text/vtt
    text/x-component
    text/xml;

  server {
    listen 8081;
    server_name _;
    
    # MapProxy endpoints with /mapproxy prefix
    location /mapproxy/ {
      # Strip the /mapproxy prefix when proxying
      rewrite ^/mapproxy/(.*) /$1 break;

      proxy_pass http://mapproxy_servers;

      # X-Script-Name is MapProxy's documented mechanism for a reverse proxy
      # mounting it on a sub-path: https://mapproxy.github.io/mapproxy/latest/deployment.html
      # -- without it, GetCapabilities documents would embed the internal
      # root-relative URL instead of https://host/mapproxy/...
      proxy_set_header X-Script-Name /mapproxy;
      proxy_set_header Host $http_host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Forwarded-Host $http_host;

      # Enable caching
      proxy_cache backend_cache;
      proxy_cache_valid 200 302 404 1h;
      proxy_cache_key $scheme$request_method$host$request_uri;
      proxy_cache_lock on;
      proxy_cache_use_stale updating error timeout invalid_header http_500 http_502 http_503 http_504;
      proxy_cache_revalidate on;
      proxy_cache_background_update on;
      add_header X-Cache-Status $upstream_cache_status;

      proxy_buffering on;
      proxy_buffer_size 32k;
      proxy_buffers 16 32k;
      proxy_busy_buffers_size 64k;
      proxy_read_timeout 80s;
      proxy_send_timeout 65s;
      proxy_connect_timeout 5s;
    }
    
    # TileserverGL endpoints with /tileservergl prefix
    location /tileservergl/ {
      # Strip the /tileservergl prefix when proxying
      rewrite ^/tileservergl/(.*) /$1 break;
      
      # Proxy to TileserverGL container
      proxy_pass http://tileservergl:8080;
      
      # Enable caching for tile requests
      proxy_cache backend_cache;
      proxy_cache_valid 200 302 404 1h;
      proxy_cache_key $scheme$request_method$host$request_uri;
      proxy_cache_lock on;
      proxy_cache_use_stale updating error timeout invalid_header http_500 http_502 http_503 http_504;
      proxy_cache_revalidate on;
      proxy_cache_background_update on;
      add_header X-Cache-Status $upstream_cache_status;
      
      # Proxy headers
      proxy_set_header Host $http_host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Forwarded-Host $http_host;
      
      # Proxy settings
      proxy_buffering on;
      proxy_buffer_size 32k;
      proxy_buffers 16 32k;
      proxy_busy_buffers_size 64k;
      proxy_read_timeout 80s;
      proxy_send_timeout 65s;
      proxy_connect_timeout 5s;
    }
    
    # Default location (backwards compatibility - direct to MapProxy, no
    # prefix -- so no X-Script-Name here, unlike the /mapproxy/ block above)
    location / {
      proxy_pass http://mapproxy_servers;

      proxy_set_header Host $http_host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Forwarded-Host $http_host;

      # Enable caching
      proxy_cache backend_cache;
      proxy_cache_valid 200 302 404 1h;
      proxy_cache_key $scheme$request_method$host$request_uri;
      proxy_cache_lock on;
      proxy_cache_use_stale updating error timeout invalid_header http_500 http_502 http_503 http_504;
      proxy_cache_revalidate on;
      proxy_cache_background_update on;
      add_header X-Cache-Status $upstream_cache_status;

      proxy_buffering on;
      proxy_buffer_size 32k;
      proxy_buffers 16 32k;
      proxy_busy_buffers_size 64k;
      proxy_read_timeout 80s;
      proxy_send_timeout 65s;
      proxy_connect_timeout 5s;
    }

    # Health check endpoint for docker-compose / orchestrator probes
    location = /healthz {
      access_log off;
      add_header Content-Type text/plain;
      return 200 "ok\n";
    }
  }
} 